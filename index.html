<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik Solver Pro - CORE-X Live</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-green: #39ff14;
            --bg-color: #050914;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #hud {
            position: absolute;
            top: 20px;
            text-align: center;
            text-shadow: 0 0 10px var(--neon-blue);
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        /* 3D Cube CSS */
        .scene {
            width: 200px;
            height: 200px;
            perspective: 600px;
            margin-top: 50px;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(45deg);
            transition: transform 1s ease-in-out;
            animation: spinCube 8s infinite linear;
        }
        @keyframes spinCube {
            0% { transform: rotateX(-20deg) rotateY(0deg); }
            100% { transform: rotateX(-20deg) rotateY(360deg); }
        }
        .face {
            position: absolute;
            width: 196px;
            height: 196px;
            border: 2px solid var(--neon-blue);
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.5);
            background: rgba(10, 20, 40, 0.8);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            padding: 2px;
        }
        .sticker {
            background-color: #222;
            border-radius: 4px;
            transition: background-color 0.5s;
        }
        .front  { transform: translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY(90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX(90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        /* Terminal UI */
        #terminal {
            position: absolute;
            bottom: 30px;
            width: 80%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }
        .log-line {
            margin: 5px 0;
            font-size: 0.9rem;
            color: #ccc;
        }
        .highlight {
            color: var(--neon-green);
            font-weight: bold;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1.1rem;
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-blue);
            transition: 0.3s;
            position: absolute;
            bottom: 220px;
        }
        button:hover {
            background: var(--neon-blue);
            color: #000;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1>Rubik Solver Pro</h1>
        <p>Algorithm: CORE-X (Original)</p>
    </div>

    <div class="scene">
        <div class="cube" id="main-cube">
            <div class="face front" id="f-face"></div>
            <div class="face back" id="b-face"></div>
            <div class="face right" id="r-face"></div>
            <div class="face left" id="l-face"></div>
            <div class="face top" id="u-face"></div>
            <div class="face bottom" id="d-face"></div>
        </div>
    </div>

    <button onclick="startCoreXSolve()" id="startBtn">▶ Start CORE-X Solve</button>

    <div id="terminal">
        <div class="log-line" style="color: var(--neon-blue);">[SYSTEM] Ready to execute CORE-X sequence...</div>
    </div>

    <script>
        // Setup Grid for Cube Faces
        const faces = document.querySelectorAll('.face');
        faces.forEach(face => {
            for(let i=0; i<9; i++) {
                let sticker = document.createElement('div');
                sticker.className = 'sticker';
                face.appendChild(sticker);
            }
        });

        const terminal = document.getElementById('terminal');
        const colors = ['#ffffff', '#ffaa00', '#00ff00', '#0000ff', '#ff0000', '#ffff00']; // White, Orange, Green, Blue, Red, Yellow

        function log(message, isHighlight = false) {
            const div = document.createElement('div');
            div.className = `log-line ${isHighlight ? 'highlight' : ''}`;
            div.textContent = `> ${message}`;
            terminal.appendChild(div);
            if(terminal.childElementCount > 6) terminal.removeChild(terminal.firstChild);
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // Simulate Cube Coloring based on Phases
        function colorStickers(indices, color) {
            faces.forEach(face => {
                indices.forEach(idx => {
                    face.children[idx].style.backgroundColor = color;
                    face.children[idx].style.boxShadow = `0 0 10px ${color}`;
                });
            });
        }

        async function startCoreXSolve() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('main-cube').style.animationDuration = '2s'; // Speed up spin
            
            // Scramble Reset
            log("Initializing Cube State Engine...", true);
            await sleep(1000);
            log("Scramble Detected: R U' R2 F2 U' M2...");
            await sleep(1500);

            // Phase 1
            log("[PHASE 1] The 3D Axis: Aligning Centers & Inner Edges", true);
            await sleep(1000);
            log("Executing Inner Slice Moves: M E M' S...");
            colorStickers([4, 1, 3, 5, 7], colors[4]); // Center cross simulation
            await sleep(2000);

            // Phase 2
            log("[PHASE 2] Corner Docking: Applying Commutators", true);
            await sleep(1000);
            log("Calculating A B A' B' inserts...");
            colorStickers([0, 2, 6, 8], colors[2]); // Corners simulation
            await sleep(2500);

            // Phase 3
            log("[PHASE 3] Radial Orbit Sync: Resolving outer edges", true);
            await sleep(1000);
            log("A* Search found optimal path: U2 R2 U2...");
            // Fill entire cube with proper colors simulation
            faces[0].childNodes.forEach(s => s.style.backgroundColor = colors[2]); // F
            faces[1].childNodes.forEach(s => s.style.backgroundColor = colors[3]); // B
            faces[2].childNodes.forEach(s => s.style.backgroundColor = colors[4]); // R
            faces[3].childNodes.forEach(s => s.style.backgroundColor = colors[1]); // L
            faces[4].childNodes.forEach(s => s.style.backgroundColor = colors[0]); // U
            faces[5].childNodes.forEach(s => s.style.backgroundColor = colors[5]); // D
            
            faces.forEach(f => f.childNodes.forEach(s => s.style.boxShadow = 'none'));
            
            await sleep(1500);
            log("[SUCCESS] Cube Solved in 24 Moves using CORE-X!", true);
            document.getElementById('main-cube').style.animationDuration = '8s'; // Slow down spin
        }
    </script>
</body>
</html>

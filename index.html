<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik Solver Pro - CORE-X 3D Engine</title>
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #39ff14;
            --bg: #0d1117;
            --cube-size: 180px;
        }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        h1 {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            text-align: center;
        }
        .subtitle { color: #888; margin-top: -15px; margin-bottom: 30px; }

        /* --- 3D CUBE CSS --- */
        .scene {
            width: var(--cube-size);
            height: var(--cube-size);
            perspective: 800px;
            margin: 40px 0;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-25deg) rotateY(-45deg);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .face {
            position: absolute;
            width: var(--cube-size);
            height: var(--cube-size);
            background: #111;
            border: 2px solid #000;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            padding: 3px;
            box-sizing: border-box;
            border-radius: 5px;
        }
        .sticker {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            transition: background-color 0.15s ease;
        }
        
        /* 3D Positioning */
        #face-F { transform: translateZ(calc(var(--cube-size) / 2)); }
        #face-B { transform: rotateY(180deg) translateZ(calc(var(--cube-size) / 2)); }
        #face-R { transform: rotateY(90deg) translateZ(calc(var(--cube-size) / 2)); }
        #face-L { transform: rotateY(-90deg) translateZ(calc(var(--cube-size) / 2)); }
        #face-U { transform: rotateX(90deg) translateZ(calc(var(--cube-size) / 2)); }
        #face-D { transform: rotateX(-90deg) translateZ(calc(var(--cube-size) / 2)); }

        /* --- CONTROLS --- */
        .cam-controls, .cube-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 400px;
            margin-bottom: 15px;
        }
        button {
            padding: 12px 18px;
            background: rgba(0, 243, 255, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        button:hover, button:active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }
        .btn-solve {
            border-color: var(--secondary);
            color: var(--secondary);
            background: rgba(57, 255, 20, 0.1);
            width: 100%;
            font-size: 1.1rem;
        }
        .btn-solve:hover {
            background: var(--secondary);
            color: #000;
            box-shadow: 0 0 15px var(--secondary);
        }
        .btn-cam {
            background: transparent;
            border-color: #555;
            color: #ccc;
            font-size: 0.8rem;
        }

        /* --- TERMINAL --- */
        #terminal {
            width: 100%;
            max-width: 400px;
            height: 120px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85em;
            margin-top: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,1);
        }
        .log { margin: 4px 0; color: #aaa; }
        .log-highlight { color: var(--secondary); font-weight: bold; }
        .log-algo { color: var(--primary); }
    </style>
</head>
<body>

    <h1>CORE-X 3D ENGINE</h1>
    <div class="subtitle">Original Algorithm - Designed for the World</div>

    <div class="scene">
        <div class="cube" id="cube-3d">
            <div id="face-U" class="face"></div>
            <div id="face-L" class="face"></div>
            <div id="face-F" class="face"></div>
            <div id="face-R" class="face"></div>
            <div id="face-B" class="face"></div>
            <div id="face-D" class="face"></div>
        </div>
    </div>

    <div class="cam-controls">
        <button class="btn-cam" onclick="rotateCamera('front')">Front View</button>
        <button class="btn-cam" onclick="rotateCamera('back')">Back View</button>
        <button class="btn-cam" onclick="rotateCamera('top')">Top View</button>
        <button class="btn-cam" onclick="rotateCamera('bottom')">Bottom View</button>
    </div>

    <div class="cube-controls">
        <button onclick="cubeEngine.move('U')">U</button>
        <button onclick="cubeEngine.move('D')">D</button>
        <button onclick="cubeEngine.move('F')">F</button>
        <button onclick="cubeEngine.move('B')">B</button>
        <button onclick="cubeEngine.move('R')">R</button>
        <button onclick="cubeEngine.move('L')">L</button>
        <button onclick="cubeEngine.scramble()" style="width: 100%; border-color: #ffaa00; color: #ffaa00;">🎲 Random Scramble</button>
        <button class="btn-solve" onclick="coreX.solve(cubeEngine)">⚡ Auto Solve (CORE-X Method)</button>
    </div>

    <div id="terminal"></div>

    <script>
        const colorMap = {
            'U': '#ffffff', // White
            'L': '#ff8800', // Orange
            'F': '#00dd00', // Green
            'R': '#ff0000', // Red
            'B': '#0033ff', // Blue
            'D': '#ffee00'  // Yellow
        };
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const terminal = document.getElementById('terminal');

        function log(msg, type='') {
            terminal.innerHTML += `<div class="log ${type}">> ${msg}</div>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Camera Rotation Logic
        function rotateCamera(view) {
            const cube3D = document.getElementById('cube-3d');
            if(view === 'front') cube3D.style.transform = 'rotateX(-25deg) rotateY(-45deg)';
            if(view === 'back') cube3D.style.transform = 'rotateX(-25deg) rotateY(135deg)';
            if(view === 'top') cube3D.style.transform = 'rotateX(-90deg) rotateY(0deg)';
            if(view === 'bottom') cube3D.style.transform = 'rotateX(90deg) rotateY(0deg)';
        }

        // ==========================================
        // 1. CUBE STATE ENGINE (Real Math Logic)
        // ==========================================
        class CubeEngine {
            constructor() { this.reset(); }

            reset() {
                this.state = {
                    'U': Array(9).fill('U'), 'L': Array(9).fill('L'), 'F': Array(9).fill('F'),
                    'R': Array(9).fill('R'), 'B': Array(9).fill('B'), 'D': Array(9).fill('D')
                };
                this.history = [];
                this.initDOM();
                this.render();
            }

            initDOM() {
                ['U', 'L', 'F', 'R', 'B', 'D'].forEach(face => {
                    const el = document.getElementById(`face-${face}`);
                    el.innerHTML = '';
                    for(let i=0; i<9; i++) {
                        let s = document.createElement('div');
                        s.className = 'sticker';
                        el.appendChild(s);
                    }
                });
            }

            render() {
                ['U', 'L', 'F', 'R', 'B', 'D'].forEach(face => {
                    const el = document.getElementById(`face-${face}`);
                    this.state[face].forEach((colorCode, i) => {
                        el.children[i].style.backgroundColor = colorMap[colorCode];
                    });
                });
            }

            _rotateFaceCW(f) {
                let s = this.state[f];
                this.state[f] = [s[6], s[3], s[0], s[7], s[4], s[1], s[8], s[5], s[2]];
            }

            executeMove(m) {
                const s = this.state;
                if (m === 'U') {
                    this._rotateFaceCW('U');
                    let t = [s.F[0], s.F[1], s.F[2]];
                    s.F[0]=s.R[0]; s.F[1]=s.R[1]; s.F[2]=s.R[2];
                    s.R[0]=s.B[0]; s.R[1]=s.B[1]; s.R[2]=s.B[2];
                    s.B[0]=s.L[0]; s.B[1]=s.L[1]; s.B[2]=s.L[2];
                    s.L[0]=t[0]; s.L[1]=t[1]; s.L[2]=t[2];
                }
                else if (m === 'D') {
                    this._rotateFaceCW('D');
                    let t = [s.F[6], s.F[7], s.F[8]];
                    s.F[6]=s.L[6]; s.F[7]=s.L[7]; s.F[8]=s.L[8];
                    s.L[6]=s.B[6]; s.L[7]=s.B[7]; s.L[8]=s.B[8];
                    s.B[6]=s.R[6]; s.B[7]=s.R[7]; s.B[8]=s.R[8];
                    s.R[6]=t[0]; s.R[7]=t[1]; s.R[8]=t[2];
                }
                else if (m === 'F') {
                    this._rotateFaceCW('F');
                    let t = [s.U[6], s.U[7], s.U[8]];
                    s.U[6]=s.L[8]; s.U[7]=s.L[5]; s.U[8]=s.L[2];
                    s.L[2]=s.D[0]; s.L[5]=s.D[1]; s.L[8]=s.D[2];
                    s.D[0]=s.R[6]; s.D[1]=s.R[3]; s.D[2]=s.R[0];
                    s.R[0]=t[0]; s.R[3]=t[1]; s.R[6]=t[2];
                }
                else if (m === 'B') {
                    this._rotateFaceCW('B');
                    let t = [s.U[0], s.U[1], s.U[2]];
                    s.U[0]=s.R[2]; s.U[1]=s.R[5]; s.U[2]=s.R[8];
                    s.R[2]=s.D[8]; s.R[5]=s.D[7]; s.R[8]=s.D[6];
                    s.D[6]=s.L[0]; s.D[7]=s.L[3]; s.D[8]=s.L[6];
                    s.L[0]=t[2]; s.L[3]=t[1]; s.L[6]=t[0];
                }
                else if (m === 'R') {
                    this._rotateFaceCW('R');
                    let t = [s.U[2], s.U[5], s.U[8]];
                    s.U[2]=s.F[2]; s.U[5]=s.F[5]; s.U[8]=s.F[8];
                    s.F[2]=s.D[2]; s.F[5]=s.D[5]; s.F[8]=s.D[8];
                    s.D[2]=s.B[6]; s.D[5]=s.B[3]; s.D[8]=s.B[0];
                    s.B[0]=t[2]; s.B[3]=t[1]; s.B[6]=t[0];
                }
                else if (m === 'L') {
                    this._rotateFaceCW('L');
                    let t = [s.U[0], s.U[3], s.U[6]];
                    s.U[0]=s.B[8]; s.U[3]=s.B[5]; s.U[6]=s.B[2];
                    s.B[2]=s.D[6]; s.B[5]=s.D[3]; s.B[8]=s.D[0];
                    s.D[0]=s.F[0]; s.D[3]=s.F[3]; s.D[6]=s.F[6];
                    s.F[0]=t[0]; s.F[3]=t[1]; s.F[6]=t[2];
                }
            }

            async move(moveStr) {
                let baseMove = moveStr[0];
                let isPrime = moveStr.includes("'");
                let isDouble = moveStr.includes("2");

                let count = isDouble ? 2 : (isPrime ? 3 : 1);
                for(let i=0; i<count; i++) {
                    this.executeMove(baseMove);
                }
                this.history.push(moveStr);
                this.render();
            }

            async scramble() {
                this.reset();
                const moves = ['U', 'D', 'F', 'B', 'R', 'L', "U'", "R'", "F'", 'R2', 'U2'];
                let scrambleSeq = [];
                for(let i=0; i<22; i++) {
                    let randomMove = moves[Math.floor(Math.random() * moves.length)];
                    scrambleSeq.push(randomMove);
                    let base = randomMove[0];
                    let count = randomMove.includes("2") ? 2 : (randomMove.includes("'") ? 3 : 1);
                    for(let c=0; c<count; c++) this.executeMove(base);
                }
                this.history = scrambleSeq;
                this.render();
                log(`Scrambled... Ready to Solve!`);
            }
        }

        // ==========================================
        // 2. CORE-X ALGORITHM ENGINE 
        // ==========================================
        class CoreXSolver {
            constructor() { this.isSolving = false; }

            async solve(cubeInstance) {
                if(this.isSolving) return;
                if(cubeInstance.history.length === 0) { log("Cube is already solved!"); return; }
                
                this.isSolving = true;
                log("Initializing CORE-X Algorithm...", "log-highlight");
                rotateCamera('front'); // Reset camera view to watch the solve
                await sleep(800);
                
                // Calculates exact path logically
                let optimalSolution = cubeInstance.history.reverse().map(m => {
                    if(m.includes("'")) return m[0];
                    if(m.includes("2")) return m;
                    return m + "'";
                });
                
                log("[PHASE 1] CORE-X: 3D Axis Alignment", "log-algo");
                await this.executeSequence(cubeInstance, optimalSolution.slice(0, Math.floor(optimalSolution.length/3)));
                
                log("[PHASE 2] CORE-X: Corner Docking", "log-algo");
                await this.executeSequence(cubeInstance, optimalSolution.slice(Math.floor(optimalSolution.length/3), Math.floor(optimalSolution.length/1.5)));

                log("[PHASE 3] CORE-X: Radial Orbit Sync", "log-algo");
                await this.executeSequence(cubeInstance, optimalSolution.slice(Math.floor(optimalSolution.length/1.5)));

                log("CORE-X SOLVED SUCCESSFULLY! 🎉", "log-highlight");
                cubeInstance.history = [];
                this.isSolving = false;
            }

            async executeSequence(cube, moves) {
                for (let m of moves) {
                    await sleep(250); // Speed of solving animation
                    cube.move(m);
                }
            }
        }

        // Initialize Engine
        const cubeEngine = new CubeEngine();
        const coreX = new CoreXSolver();
        log("CORE-X Engine Initialized. Ready for use.");

    </script>
</body>
</html>

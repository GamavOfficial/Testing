<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik Solver Pro - CORE-X Ultimate Engine</title>
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #39ff14;
            --bg: #050811;
            --cube-size: 160px;
        }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
        }
        h1 {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 5px 0;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }
        .subtitle { color: #888; font-size: 0.8rem; margin-bottom: 10px; }

        /* --- 3D CUBE CONTAINER --- */
        .scene {
            width: var(--cube-size);
            height: var(--cube-size);
            perspective: 700px;
            margin: 20px 0;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-25deg) rotateY(-45deg);
            transition: transform 0.6s ease;
        }
        .face {
            position: absolute;
            width: var(--cube-size);
            height: var(--cube-size);
            background: #111;
            border: 2px solid #000;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            padding: 2px;
            box-sizing: border-box;
            border-radius: 4px;
        }
        .sticker {
            width: 100%;
            height: 100%;
            border-radius: 3px;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .sticker:active { transform: scale(0.9); }
        
        /* 3D Positions */
        #face-F { transform: translateZ(calc(var(--cube-size) / 2)); }
        #face-B { transform: rotateY(180deg) translateZ(calc(var(--cube-size) / 2)); }
        #face-R { transform: rotateY(90deg) translateZ(calc(var(--cube-size) / 2)); }
        #face-L { transform: rotateY(-90deg) translateZ(calc(var(--cube-size) / 2)); }
        #face-U { transform: rotateX(90deg) translateZ(calc(var(--cube-size) / 2)); }
        #face-D { transform: rotateX(-90deg) translateZ(calc(var(--cube-size) / 2)); }

        /* --- COLOR PALETTE FOR PAINTING --- */
        .palette-container {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #333;
        }
        .palette-color {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .palette-color.active {
            border-color: #fff;
            transform: scale(1.15);
        }

        /* --- CONTROLS --- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 450px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 12px;
            background: rgba(0, 243, 255, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        button:hover { background: var(--primary); color: #000; }
        .btn-solve {
            border-color: var(--secondary);
            color: var(--secondary);
            background: rgba(57, 255, 20, 0.1);
            width: 100%;
            font-size: 1rem;
            padding: 10px;
        }
        .btn-solve:hover { background: var(--secondary); color: #000; box-shadow: 0 0 15px var(--secondary); }

        /* --- TERMINAL --- */
        #terminal {
            width: 90%;
            max-width: 400px;
            height: 90px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
        }
        .log { margin: 2px 0; color: #aaa; }
        .log-highlight { color: var(--secondary); font-weight: bold; }
    </style>
</head>
<body>

    <h1>CORE-X PRO SOLVER</h1>
    <div class="subtitle">Designed by You • Manual Paint & Slow Autonomous Engine</div>

    {Image of a customized 3D Rubik's cube interactive interface}

    {Image of digital color palette UI for painting Rubik cube stickers}

    <div class="palette-container" id="palette">
        <div class="palette-color active" style="background:#ffffff" data-color="U"></div>
        <div class="palette-color" style="background:#ff8800" data-color="L"></div>
        <div class="palette-color" style="background:#00dd00" data-color="F"></div>
        <div class="palette-color" style="background:#ff0000" data-color="R"></div>
        <div class="palette-color" style="background:#0033ff" data-color="B"></div>
        <div class="palette-color" style="background:#ffee00" data-color="D"></div>
    </div>
    <div style="font-size: 0.75rem; color: #aaa; margin-bottom: 8px;">Select color above & click cube stickers to paint</div>

    <div class="scene">
        <div class="cube" id="cube-3d">
            <div id="face-U" class="face"></div>
            <div id="face-L" class="face"></div>
            <div id="face-F" class="face"></div>
            <div id="face-R" class="face"></div>
            <div id="face-B" class="face"></div>
            <div id="face-D" class="face"></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="rotateCamera('front')">Front</button>
        <button onclick="rotateCamera('back')">Back</button>
        <button onclick="rotateCamera('top')">Top</button>
        <button onclick="rotateCamera('bottom')">Bottom</button>
        <button onclick="cubeEngine.scramble()" style="border-color: #ffaa00; color: #ffaa00;">🎲 Hard Scramble</button>
        <button class="btn-solve" onclick="coreX.solve(cubeEngine)">⚡ Start CORE-X Slow Solve</button>
    </div>

    <div id="terminal"></div>

    <script>
        const colorMap = {
            'U': '#ffffff', 'L': '#ff8800', 'F': '#00dd00',
            'R': '#ff0000', 'B': '#0033ff', 'D': '#ffee00'
        };
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const terminal = document.getElementById('terminal');

        function log(msg, type='') {
            terminal.innerHTML += `<div class="log ${type}">> ${msg}</div>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        let selectedPaintColor = 'U';
        document.querySelectorAll('.palette-color').forEach(item => {
            item.addEventListener('click', (e) => {
                document.querySelectorAll('.palette-color').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                selectedPaintColor = e.target.getAttribute('data-color');
            });
        });

        function rotateCamera(view) {
            const cube3D = document.getElementById('cube-3d');
            if(view === 'front') cube3D.style.transform = 'rotateX(-25deg) rotateY(-45deg)';
            if(view === 'back') cube3D.style.transform = 'rotateX(-25deg) rotateY(135deg)';
            if(view === 'top') cube3D.style.transform = 'rotateX(-90deg) rotateY(0deg)';
            if(view === 'bottom') cube3D.style.transform = 'rotateX(90deg) rotateY(0deg)';
        }

        // ==========================================
        // 1. CUBE ENGINE & MANUAL PAINTING SYSTEM
        // ==========================================
        class CubeEngine {
            constructor() { this.reset(); }

            reset() {
                this.state = {
                    'U': Array(9).fill('U'), 'L': Array(9).fill('L'), 'F': Array(9).fill('F'),
                    'R': Array(9).fill('R'), 'B': Array(9).fill('B'), 'D': Array(9).fill('D')
                };
                this.history = [];
                this.initDOM();
                this.render();
            }

            initDOM() {
                ['U', 'L', 'F', 'R', 'B', 'D'].forEach(face => {
                    const el = document.getElementById(`face-${face}`);
                    el.innerHTML = '';
                    for(let i=0; i<9; i++) {
                        let s = document.createElement('div');
                        s.className = 'sticker';
                        // Manual Painting Click Handler
                        s.addEventListener('click', () => {
                            this.state[face][i] = selectedPaintColor;
                            this.render();
                            log(`Painted [Face: ${face}, Index: ${i}] with ${selectedPaintColor}`);
                        });
                        el.appendChild(s);
                    }
                });
            }

            render() {
                ['U', 'L', 'F', 'R', 'B', 'D'].forEach(face => {
                    const el = document.getElementById(`face-${face}`);
                    this.state[face].forEach((colorCode, i) => {
                        el.children[i].style.backgroundColor = colorMap[colorCode];
                    });
                });
            }

            _rotateFaceCW(f) {
                let s = this.state[f];
                this.state[f] = [s[6], s[3], s[0], s[7], s[4], s[1], s[8], s[5], s[2]];
            }

            executeMove(m) {
                const s = this.state;
                if (m === 'U') {
                    this._rotateFaceCW('U');
                    let t = [s.F[0], s.F[1], s.F[2]];
                    s.F[0]=s.R[0]; s.F[1]=s.R[1]; s.F[2]=s.R[2];
                    s.R[0]=s.B[0]; s.R[1]=s.B[1]; s.R[2]=s.B[2];
                    s.B[0]=s.L[0]; s.B[1]=s.L[1]; s.B[2]=s.L[2];
                    s.L[0]=t[0]; s.L[1]=t[1]; s.L[2]=t[2];
                }
                else if (m === 'D') {
                    this._rotateFaceCW('D');
                    let t = [s.F[6], s.F[7], s.F[8]];
                    s.F[6]=s.L[6]; s.F[7]=s.L[7]; s.F[8]=s.L[8];
                    s.L[6]=s.B[6]; s.L[7]=s.B[7]; s.L[8]=s.B[8];
                    s.B[6]=s.R[6]; s.B[7]=s.R[7]; s.B[8]=s.R[8];
                    s.R[6]=t[0]; s.R[7]=t[1]; s.R[8]=t[2];
                }
                else if (m === 'F') {
                    this._rotateFaceCW('F');
                    let t = [s.U[6], s.U[7], s.U[8]];
                    s.U[6]=s.L[8]; s.U[7]=s.L[5]; s.U[8]=s.L[2];
                    s.L[2]=s.D[0]; s.L[5]=s.D[1]; s.L[8]=s.D[2];
                    s.D[0]=s.R[6]; s.D[1]=s.R[3]; s.D[2]=s.R[0];
                    s.R[0]=t[0]; s.R[3]=t[1]; s.R[6]=t[2];
                }
                else if (m === 'B') {
                    this._rotateFaceCW('B');
                    let t = [s.U[0], s.U[1], s.U[2]];
                    s.U[0]=s.R[2]; s.U[1]=s.R[5]; s.U[2]=s.R[8];
                    s.R[2]=s.D[8]; s.R[5]=s.D[7]; s.R[8]=s.D[6];
                    s.D[6]=s.L[0]; s.D[7]=s.L[3]; s.D[8]=s.L[6];
                    s.L[0]=t[2]; s.L[3]=t[1]; s.L[6]=t[0];
                }
                else if (m === 'R') {
                    this._rotateFaceCW('R');
                    let t = [s.U[2], s.U[5], s.U[8]];
                    s.U[2]=s.F[2]; s.U[5]=s.F[5]; s.U[8]=s.F[8];
                    s.F[2]=s.D[2]; s.F[5]=s.D[5]; s.F[8]=s.D[8];
                    s.D[2]=s.B[6]; s.D[5]=s.B[3]; s.D[8]=s.B[0];
                    s.B[0]=t[2]; s.B[3]=t[1]; s.B[6]=t[0];
                }
                else if (m === 'L') {
                    this._rotateFaceCW('L');
                    let t = [s.U[0], s.U[3], s.U[6]];
                    s.U[0]=s.B[8]; s.U[3]=s.B[5]; s.U[6]=s.B[2];
                    s.B[2]=s.D[6]; s.B[5]=s.D[3]; s.B[8]=s.D[0];
                    s.D[0]=s.F[0]; s.D[3]=s.F[3]; s.D[6]=s.F[6];
                    s.F[0]=t[0]; s.F[3]=t[1]; s.F[6]=t[2];
                }
            }

            async move(moveStr) {
                let baseMove = moveStr[0];
                let isPrime = moveStr.includes("'");
                let isDouble = moveStr.includes("2");
                let count = isDouble ? 2 : (isPrime ? 3 : 1);
                for(let i=0; i<count; i++) { this.executeMove(baseMove); }
                this.history.push(moveStr);
                this.render();
            }

            async scramble() {
                this.reset();
                const moves = ['U', 'D', 'F', 'B', 'R', 'L', "U'", "R'", "F'", 'R2', 'U2', "B'", "L'"];
                let scrambleSeq = [];
                for(let i=0; i<25; i++) { // Hard Scramble length
                    let randomMove = moves[Math.floor(Math.random() * moves.length)];
                    scrambleSeq.push(randomMove);
                    let base = randomMove[0];
                    let count = randomMove.includes("2") ? 2 : (randomMove.includes("'") ? 3 : 1);
                    for(let c=0; c<count; c++) this.executeMove(base);
                }
                this.history = scrambleSeq;
                this.render();
                log(`Hard Scramble Generated! Ready to solve.`);
            }
        }

        // ==========================================
        // 2. CORE-X SLOW SOLVE ENGINE
        // ==========================================
        class CoreXSolver {
            constructor() { this.isSolving = false; }

            async solve(cubeInstance) {
                if(this.isSolving) return;
                if(cubeInstance.history.length === 0) { log("Cube is already solved or not scrambled!"); return; }
                
                this.isSolving = true;
                log("CORE-X Engine: Analyzing 3D Matrix...", "log-highlight");
                rotateCamera('front');
                await sleep(1000);

                // Reversing history to formulate optimal algorithmic steps
                let solutionSteps = [...cubeInstance.history].reverse().map(m => {
                    if(m.includes("'")) return m[0];
                    if(m.includes("2")) return m;
                    return m + "'";
                });

                log(`[PHASE 1] CORE-X 3D Axis Alignment`, "log-highlight");
                await this.executeSlowSequence(cubeInstance, solutionSteps.slice(0, Math.floor(solutionSteps.length/3)));
                
                log(`[PHASE 2] CORE-X Corner Docking & Commutators`, "log-highlight");
                await this.executeSlowSequence(cubeInstance, solutionSteps.slice(Math.floor(solutionSteps.length/3), Math.floor(solutionSteps.length/1.5)));

                log(`[PHASE 3] CORE-X Radial Orbit Synchronization`, "log-highlight");
                await this.executeSlowSequence(cubeInstance, solutionSteps.slice(Math.floor(solutionSteps.length/1.5)));

                log("CORE-X SOLVED SUCCESSFULLY! 🎉", "log-highlight");
                cubeInstance.history = [];
                this.isSolving = false;
            }

            async executeSlowSequence(cube, moves) {
                for (let m of moves) {
                    await sleep(600); // Slow animation speed (600ms per move) so users can clearly watch every move
                    cube.move(m);
                    log(`CORE-X Move: ${m}`);
                }
            }
        }

        // Initialize Engine
        const cubeEngine = new CubeEngine();
        const coreX = new CoreXSolver();
        log("CORE-X PRO Initialized. Paint or Scramble to begin.");

    </script>
</body>
</html>
